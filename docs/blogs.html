<!-- Include CSS -->
<link href="../css/tailwind.css" rel="stylesheet">

        display: flex;
        flex-direction: column;

        flex: 1;

</style>

<!-- Include JS -->
<script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.14.7/dist/cdn.min.js"></script>
    <meta property="og:title" content="Pat Legault Blogs" />
    <meta property="og:url" content="https://www.patlego.com/blogs.html" />
</head>

<body>
    <!-- Include header -->
    <header x-data="{ open: false }">
    <div class="flex justify-between items-center p-4 bg-black">
        <h1 class="text-xl font-bold text-white">Pat Lego.com</h1>
        <nav class="hidden md:block">
            <ul class="flex space-x-4">
                <li><a class="hover:text-blue-500 text-white" href="/">Home</a></li>
                <li><a class="hover:text-blue-500 text-white" href="/about.html">About</a></li>
                <li><a class="hover:text-blue-500 text-white" href="/blogs.html">Blogs</a></li>
                <li><a class="hover:text-blue-500 text-white" href="/store.html">Store</a></li>
            </ul>
        </nav>
        <button @click="open = !open" class="md:hidden text-white focus:outline-none">
            <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"
                xmlns="http://www.w3.org/2000/svg">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16m-7 6h7"></path>
            </svg>
        </button>
    </div>

    <!-- Mobile Menu -->
    <div x-show="open" class="md:hidden flex flex-col items-end w-full bg-black p-4">
        <nav>
            <ul class="flex flex-col space-y-4">
                <li><a class="hover:text-blue-500 text-white" href="/">Home</a></li>
                <li><a class="hover:text-blue-500 text-white" href="/about.html">About</a></li>
                <li><a class="hover:text-blue-500 text-white" href="/blogs.html">Blogs</a></li>
                <li><a class="hover:text-blue-500 text-white" href="/store.html">Store</a></li>
            </ul>
        </nav>
    </div>
</header>


    <main>
        <section class="flex flex-col items-center w-full" x-data="getBlogs">
    <div class="flex flex-col items-center w-full mt-5 mb-3 px-4">
        <h1 class="text-2xl md:text-3xl font-bold text-center">Blogs</h1>
        <p class="text-center text-gray-600 mt-2 max-w-xl">Notes and write-ups on things I've run into building and
            running software.</p>
        <input type="text" class="w-full max-w-md mt-4 border-b-2 border-black p-1" placeholder="Search blogs"
            x-ref="searchInput" x-model="search" x-on:keydown.window.prevent.slash="$refs.searchInput.focus()" />
    </div>

    <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-4 w-full max-w-6xl px-4 pb-10">
        <template x-for="blog in filteredBlogs" :key="blog.slug">
            <a :href="`/blogs/${blog.slug}.html`"
                class="flex flex-col border-2 border-black rounded-lg overflow-hidden p-4 hover:bg-black hover:text-white group">
                <h2 class="font-bold text-lg" x-text="blog.name"></h2>
                <p class="text-sm text-gray-600 group-hover:text-gray-300 mt-1 flex-1" x-text="blog.summary"></p>
                <span class="mt-4 text-sm font-bold">Read &rarr;</span>
            </a>
        </template>
    </div>

    <div class="flex w-full justify-center pb-10" x-show="filteredBlogs.length === 0">
        <p class="text-gray-600">No blogs match your search.</p>
    </div>
</section>
<script>
    function getBlogs() {
        return {
            search: '',
            allBlogs: blogs,
            get filteredBlogs() {
                if (!this.search) {
                    return this.allBlogs;
                }
                return this.allBlogs.filter(blog => {
                    return blog.name.toLowerCase().includes(this.search.toLowerCase());
                });
            },
        };
    };
    // Single source of truth for posts: src/blogs/blogs.json (also drives the generated post pages).
    const blogs = [
    {
        "slug": "blog-1",
        "name": "Git Init",
        "summary": "Kicking off the blog."
    },
    {
        "slug": "guarded-job-management",
        "name": "Herding Cats: Ordered Job Processing",
        "summary": "A deep dive into Guarded Job Management, a distributed job processing system for AEM that guarantees ordered execution of jobs across multiple instances using cryptographically-signed tokens.",
        "title": "Herding Cats: Ordered Job Processing in AEM",
        "description": "A deep dive into Guarded Job Management — a distributed job processing system for AEM that guarantees ordered execution of jobs across multiple instances using cryptographically-signed tokens."
    },
    {
        "slug": "proxying-with-advancednetworking-and-dispatcher",
        "name": "HTTPD and Networking",
        "summary": "AEM as a Cloud Service Dispatcher and Advanced Networking.",
        "title": "AEM as a Cloud Service Dispatcher and Advanced Networking",
        "description": "AEM as a Cloud Service Dispatcher and Advanced Networking"
    },
    {
        "slug": "include-property-types",
        "name": "includePropertyTypes in AEM Indexes",
        "summary": "How includePropertyTypes affects full text query results with CONTAINS in JCR-SQL2.",
        "title": "Understanding includePropertyTypes in AEM Lucene Indexes",
        "description": "How includePropertyTypes affects full text query results with CONTAINS in JCR-SQL2"
    },
    {
        "slug": "aem-archetype-and-preventing-errors",
        "name": "Review the AEM Archetype",
        "summary": "Leveraging the AEM Archetype to prevent runtime errors.",
        "title": "AEM Archetype and how it can prevent errors",
        "description": "Leveraging the AEM Archetype to prevent runtime errors"
    },
    {
        "slug": "saml-request-response-symmetry",
        "name": "SAML Symmetry",
        "summary": "SAML Authentication in AEM requires the content to come back to the original SAML request or else HTTP 422 errors may occur.",
        "title": "SAML Authentication in AEM, symmetry is key",
        "description": "SAML Authentication in AEM requires the content to come back to the original SAML request or else HTTP 422 errors may occur"
    },
    {
        "slug": "what-is-thread-starvation",
        "name": "Thread starvation?",
        "summary": "Learn about thread starvation and how it can affect your JVM's performance, or worse, cause it to crash.",
        "title": "JVM Thread Starvation and how to detect it",
        "description": "Transactions come and go but the goal is to not have them linger around, learn about thread starvation and how it can effect your JVM's performance or worse cause it to crash"
    },
    {
        "slug": "queueing-and-processing",
        "name": "Where is my workflow?",
        "summary": "Many things in AEM get queued for processing; understanding why a queue stops processing entries.",
        "title": "Why are my workflows not processing?",
        "description": "Many things in AEM get queued for processing, this blog is here to help you understand how to determine why the queue is not processing entries within it",
        "image": "/assets/debugging-linkedin.jpg",
        "imageWidth": 1200,
        "imageHeight": 1200
    },
    {
        "slug": "always-provide-an-executor",
        "name": "Asynchronous Deadlock",
        "summary": "Why asynchronous Java code in AEM needs an explicit executor.",
        "title": "Asynchronous Java code in AEM"
    },
    {
        "slug": "algolia-postconstruct-thread-starvation",
        "name": "Death by Sling Model",
        "summary": "Creating an Algolia SearchClient inside a Sling Model @PostConstruct leaks I/O dispatcher threads on every request.",
        "title": "Algolia in @PostConstruct: How a Sling Model can starve your JVM",
        "description": "Creating an Algolia SearchClient inside a Sling Model @PostConstruct leaks I/O dispatcher threads on every request. Learn why Sling Models are not Singletons, why OSGi Services are, and how to fix the leak before it crashes your AEM instance."
    },
    {
        "slug": "sling-model-query-abuse",
        "name": "JVM thread starvation caused by sling model",
        "summary": "Running a JCR query in every Sling Model @PostConstruct turns a single page render into a burst of Lucene file I/O.",
        "title": "Query Abuse in Sling Models: How Per-Component JCR Queries Create I/O Contention",
        "description": "Running a JCR query in every Sling Model @PostConstruct turns a single page render into a burst of Lucene file I/O that contends on a kernel-level NativeThreadSet lock. Learn how the Lucene index is read, why FileChannelImpl serializes concurrent readers, and how to run the query once per render instead of once per component."
    },
    {
        "slug": "java-makes-it-easy-to-write-bad-code",
        "name": "Java makes it easy to write bad code",

    },
    {

        "summary": "A slow activate() in a delayed OSGi component makes Felix SCR fail with \"Could not obtain lock\", so consumers get null and dependent components never activate even though the service is registered.",

        "description": "A registered OSGi service can still hand its consumers null. How a slow activate() in a delayed Declarative Services component makes Felix SCR time out with 'Could not obtain lock' and leaves dependent components unactivated."
    }
]
;
</script>
