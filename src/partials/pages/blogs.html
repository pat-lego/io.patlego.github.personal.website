<section class="flex flex-col items-center w-full" x-data="getBlogs">
    <div class="flex flex-col items-center w-full mt-5 mb-3 px-4">
        <h1 class="text-2xl md:text-3xl font-bold text-center">Blogs</h1>
        <p class="text-center text-gray-600 mt-2 max-w-xl">Notes and write-ups on things I've run into building and
            running software.</p>
        <input type="text" class="w-full max-w-md mt-4 border-b-2 border-black p-1" placeholder="Search blogs"
            x-ref="searchInput" x-model="search" x-on:keydown.window.prevent.slash="$refs.searchInput.focus()" />
    </div>

    <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-4 w-full max-w-6xl px-4 pb-10">
        <template x-for="blog in filteredBlogs" :key="blog.url">
            <a :href="`/blogs${blog.url}`"
                class="flex flex-col border-2 border-black rounded-lg overflow-hidden p-4 hover:bg-black hover:text-white group">
                <h2 class="font-bold text-lg" x-text="blog.name"></h2>
                <p class="text-sm text-gray-600 group-hover:text-gray-300 mt-1 flex-1" x-text="blog.description"></p>
                <span class="mt-4 text-sm font-bold">Read &rarr;</span>
            </a>
        </template>
    </div>

    <div class="flex w-full justify-center pb-10" x-show="filteredBlogs.length === 0">
        <p class="text-gray-600">No blogs match your search.</p>
    </div>
</section>
<script>
    function getBlogs() {
        return {
            search: '',
            allBlogs: blogs,
            get filteredBlogs() {
                if (!this.search) {
                    return this.allBlogs;
                }
                return this.allBlogs.filter(blog => {
                    return blog.name.toLowerCase().includes(this.search.toLowerCase());
                });
            },
        };
    };
    const blogs = [
        { name: 'Git Init', url: '/blog-1.html', description: 'Kicking off the blog.' },
        { name: 'Herding Cats: Ordered Job Processing', url: '/guarded-job-management.html', description: 'A deep dive into Guarded Job Management, a distributed job processing system for AEM that guarantees ordered execution of jobs across multiple instances using cryptographically-signed tokens.' },
        { name: 'HTTPD and Networking', url: '/proxying-with-advancednetworking-and-dispatcher.html', description: 'AEM as a Cloud Service Dispatcher and Advanced Networking.' },
        { name: 'includePropertyTypes in AEM Indexes', url: '/include-property-types.html', description: 'How includePropertyTypes affects full text query results with CONTAINS in JCR-SQL2.' },
        { name: 'Review the AEM Archetype', url: '/aem-archetype-and-preventing-errors.html', description: 'Leveraging the AEM Archetype to prevent runtime errors.' },
        { name: 'SAML Symmetry', url: '/saml-request-response-symmetry.html', description: 'SAML Authentication in AEM requires the content to come back to the original SAML request or else HTTP 422 errors may occur.' },
        { name: 'Thread starvation?', url: '/what-is-thread-starvation.html', description: 'Learn about thread starvation and how it can affect your JVM\'s performance, or worse, cause it to crash.' },
        { name: 'Where is my workflow?', url: '/queueing-and-processing.html', description: 'Many things in AEM get queued for processing; understanding why a queue stops processing entries.' },
        { name: 'Asynchronous Deadlock', url: '/always-provide-an-executor.html', description: 'Why asynchronous Java code in AEM needs an explicit executor.' },
        { name: 'Death by Sling Model', url: '/algolia-postconstruct-thread-starvation.html', description: 'Creating an Algolia SearchClient inside a Sling Model @PostConstruct leaks I/O dispatcher threads on every request.' },
        { name: 'JVM thread starvation caused by sling model', url: '/sling-model-query-abuse.html', description: 'Running a JCR query in every Sling Model @PostConstruct turns a single page render into a burst of Lucene file I/O.' },
        { name: 'Java makes it easy to write bad code', url: '/java-makes-it-easy-to-write-bad-code.html', description: 'Synchronized, unbounded collections, and HttpClient\'s missing default timeouts make it trivial to starve a servlet container\'s thread pool.' }
    ];
</script>
