<section class="flex flex-col items-center w-full" x-data="getStore">
    <div class="flex flex-col items-center w-full mt-5 mb-3 px-4">
        <h1 class="text-2xl md:text-3xl font-bold text-center">Store</h1>
        <p class="text-center text-gray-600 mt-2 max-w-xl">Guides and resources I've put together. Pick an item below to
            learn more or buy it directly.</p>
        <input type="text" class="w-full max-w-md mt-4 border-b-2 border-black p-1" placeholder="Search"
            x-model="search" />
    </div>

    <!-- Content for sale -->
    <div class="flex flex-col w-full max-w-4xl px-4 pb-10" x-show="content.length > 0">
        <h2 class="text-xl md:text-2xl font-bold mb-3">Content</h2>
        <div class="flex flex-col divide-y-2 divide-black border-2 border-black rounded-lg overflow-hidden">
            <template x-for="item in content" :key="item.slug">
                <div class="flex items-center justify-between p-4">
                    <div class="flex flex-col mr-4">
                        <a :href="`/store/${item.slug}.html`" class="hover:text-blue-500">
                            <span class="font-bold" x-text="item.name"></span>
                        </a>
                        <span class="text-sm text-gray-600" x-text="item.description"></span>
                    </div>
                    <div class="flex items-center space-x-3 shrink-0">
                        <span class="font-bold" x-text="item.price"></span>
                        <a :href="item.url" :target="item.url.startsWith('http') ? '_blank' : '_self'"
                            class="bg-black text-white px-3 py-1 rounded hover:bg-blue-500 text-sm"
                            x-text="item.buyLabel || 'Buy Now'"></a>
                    </div>
                </div>
            </template>
        </div>
    </div>

    <!-- Courses -->
    <div class="flex flex-col w-full max-w-6xl px-4 pb-10" x-show="courses.length > 0">
        <h2 class="text-xl md:text-2xl font-bold mb-3">Courses</h2>
        <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-4 w-full">
            <template x-for="course in courses" :key="course.slug">
                <div class="flex flex-col border-2 border-black rounded-lg overflow-hidden">
                    <a :href="`/store/${course.slug}.html`">
                        <img :src="course.image" :alt="course.name" class="w-full h-48 object-cover">
                    </a>
                    <div class="flex flex-col flex-1 p-4">
                        <a :href="`/store/${course.slug}.html`" class="hover:text-blue-500">
                            <h3 class="font-bold text-lg" x-text="course.name"></h3>
                        </a>
                        <span class="text-sm text-blue-500 font-bold mt-1" x-text="formatDate(course.startDate)"></span>
                        <p class="text-sm text-gray-600 mt-1 flex-1" x-text="course.description"></p>
                        <div class="flex items-center justify-between mt-4">
                            <span class="font-bold" x-text="course.price"></span>
                            <div class="flex space-x-2">
                                <a :href="`/store/${course.slug}.html`"
                                    class="border-2 border-black px-3 py-1 rounded hover:bg-black hover:text-white text-sm">Details</a>
                                <a :href="course.url" :target="course.url.startsWith('http') ? '_blank' : '_self'"
                                    class="bg-black text-white px-3 py-1 rounded hover:bg-blue-500 text-sm"
                                    x-text="course.buyLabel || 'Buy Now'"></a>
                            </div>
                        </div>
                    </div>
                </div>
            </template>
        </div>
    </div>

    <div class="flex w-full justify-center pb-10" x-show="content.length === 0 && courses.length === 0">
        <p class="text-gray-600">No products match your search.</p>
    </div>
</section>
<script>
    function getStore() {
        return {
            search: '',
            allProducts: products,
            formatDate(dateStr) {
                if (!dateStr) {
                    return 'Date TBD';
                }
                const date = new Date(`${dateStr}T00:00:00`);
                return `Starts ${date.toLocaleDateString('en-US', { month: 'long', day: 'numeric', year: 'numeric' })}`;
            },
            get filtered() {
                if (!this.search) {
                    return this.allProducts;
                }
                return this.allProducts.filter(product => {
                    return product.name.toLowerCase().includes(this.search.toLowerCase());
                });
            },
            get content() {
                return this.filtered.filter(product => product.type === 'content');
            },
            get courses() {
                return this.filtered
                    .filter(product => product.type === 'course')
                    .slice()
                    .sort((a, b) => {
                        if (!a.startDate) return 1;
                        if (!b.startDate) return -1;
                        return new Date(a.startDate) - new Date(b.startDate);
                    });
            },
        };
    };
    const products = [
        {
            slug: 'surviving-technical-support',
            type: 'content',
            name: 'A Guide to Surviving Technical Support',
            description: 'Practical strategies and lessons for working in and around technical support roles.',
            price: 'Free',
            image: '/assets/support-cartoon.svg',
            url: 'https://patrique.gumroad.com/l/sslji',
            buyLabel: 'Get it Free'
        },
        {
            slug: 'intro-to-dev',
            type: 'course',
            name: 'Intro to Dev',
            description: 'A curriculum to take you from zero to writing your first real software projects.',
            price: '$100',
            image: '/assets/intro-to-dev-cartoon.svg',
            url: '/store/intro-to-dev.html',
            buyLabel: 'View Curriculum',
            startDate: '2026-10-03'
        }
    ];
</script>
